database_path: data/job_agent.sqlite3
timezone: America/Los_Angeles
target_verified_submissions_per_day: 100
discovery:
  max_jobs_per_source_run: 1000
workers:
  discovery_concurrency: 2
  resume_concurrency: 2
  application_concurrency: 1
rate_limits:
  default_requests_per_minute: 30
application_safety:
  real_submission_enabled: false
  captcha_policy: HUMAN_REQUIRED
  ambiguous_question_policy: HUMAN_REQUIRED
llm:
  enabled: false
  provider: openai
  cheap_model: gpt-5-nano
  strong_model: gpt-5-mini
  selection_model: gpt-5-nano
  daily_cost_limit_usd: 5.0
  usage_ledger_path: data/llm_usage.sqlite3
  max_input_chars: 12000
  max_output_tokens: 2000
  send_candidate_pii: false
